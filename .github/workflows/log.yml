name: log

on:
  push:
    branches: ["**"]
    tags: ["p1", "p2", "final"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check log entries
        run: python tools/logtool.py check

  snapshot:
    # When the instructor pushes a p1 / p2 / final tag: export the log to PDF
    # and attach it to a release of the same name.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-xetex \
            texlive-fonts-recommended texlive-latex-recommended lmodern
      - name: Export log
        run: python tools/logtool.py export --ref "${GITHUB_REF_NAME}" --format pdf -o "log_${GITHUB_REF_NAME}.pdf"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: log_${{ github.ref_name }}.pdf
